name: build-driver
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Install WDK
        shell: pwsh
        run: |
          Write-Host "Installed Windows SDKs:"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include" | Select-Object -ExpandProperty Name
          $wdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\ntddk.h" -ErrorAction SilentlyContinue
          if ($wdk) {
            Write-Host "WDK headers already present: $($wdk[0].FullName)"
          } else {
            choco install windowsdriverkit11 --no-progress -y
          }
          Write-Host "WDK headers after install:"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Include\*\km\ntddk.h" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          Write-Host "WDK VS extension:"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Vsix" -Recurse -Filter WDK.vsix -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Build
        shell: pwsh
        run: msbuild WhCpuTemp.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Test-sign
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=WhCpuTemp Test" -CertStoreLocation Cert:\CurrentUser\My
          Export-Certificate -Cert $cert -FilePath WhCpuTemp.cer
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          $sys = Get-ChildItem -Recurse -Filter WhCpuTemp.sys | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $sys.FullName
          Copy-Item $sys.FullName .

      - uses: actions/upload-artifact@v4
        with:
          name: WhCpuTemp
          path: |
            WhCpuTemp.sys
            WhCpuTemp.cer
